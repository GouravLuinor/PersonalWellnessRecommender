[project]
name = "personal-wellness-recommender"
version = "2.0.0"
description = "ML-powered personal wellness recommendations with a Streamlit UI (educational, synthetic data)."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long user-facing strings are clearer unwrapped
